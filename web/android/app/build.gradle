apply plugin: 'com.android.application'

// Bento's signing key. android/keystore.properties (never committed) says
// where the key file is and its password:
//   storeFile=C:/Projects/Cookbook/signing/bento-release.jks
//   storePassword=...
//   keyAlias=bento
//   keyPassword=...
// Without it, release builds can't be signed ("npm run release" then falls
// back to Android Studio's test key).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.xel.bento"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.xel.bento"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "1.9.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // A test copy that installs beside the real Bento, as "Bento (test)":
        //   gradlew assembleDebug -PbentoTest
        // Normal builds and releases are unchanged.
        if (project.hasProperty("bentoTest")) {
            applicationIdSuffix ".test"
            manifestPlaceholders = [appLabel: "Bento (test)"]
        } else {
            manifestPlaceholders = [appLabel: "@string/app_name"]
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // The phone server is big; packing it compressed keeps the APK download
    // much smaller (Android unpacks it once when installing).
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    // Phone-only mode: Bento's server code goes into the app as files, for the
    // server built into it (BentoLocalServerPlugin copies them out).
    sourceSets {
        main { assets.srcDirs += layout.buildDirectory.dir("generated/bentoServerCode") }
    }
}

// Copies server/pb_hooks and server/pb_migrations into the app on every
// build, so the phone server always runs the same code as the Pi.
def copyServerCode = tasks.register("copyBentoServerCode", Sync) {
    from("../../../server/pb_hooks") {
        into "bento-server/pb_hooks"
        exclude "*.d.ts"
    }
    from("../../../server/pb_migrations") { into "bento-server/pb_migrations" }
    into layout.buildDirectory.dir("generated/bentoServerCode")
}
tasks.named("preBuild") { dependsOn copyServerCode }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], exclude: ['*-sources.jar'], dir: 'libs')
    // The server phone-only mode runs (made by "npm run server-lib").
    implementation files('libs/bentoserver.aar')
    // Google's barcode scanner screen, for pantry items (BentoScannerPlugin).
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
